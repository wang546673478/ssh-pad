<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Empty State - Terminal Illustration -->
  
  <!-- Terminal window background -->
  <rect x="14" y="18" width="36" height="28" rx="4" fill="#1E1E1E"/>
  <rect x="14" y="18" width="36" height="28" rx="4" stroke="#6B7280" stroke-width="2"/>
  
  <!-- Terminal header bar -->
  <rect x="14" y="18" width="36" height="6" rx="4" fill="#2D2D2D"/>
  <rect x="14" y="22" width="36" height="2" fill="#2D2D2D"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="21" r="1.5" fill="#EF4444"/>
  <circle cx="25" cy="21" r="1.5" fill="#F59E0B"/>
  <circle cx="30" cy="21" r="1.5" fill="#10B981"/>
  
  <!-- Terminal content area -->
  <rect x="18" y="28" width="28" height="14" rx="1" fill="#0F0F0F"/>
  
  <!-- Command prompt -->
  <text x="20" y="37" 
        font-family="monospace" 
        font-size="5" 
        fill="#F8F8F2">admin@server:~$</text>
  
  <!-- Blinking cursor -->
  <rect x="42" y="33" width="2" height="7" fill="#2563EB" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Decorative elements -->
  <rect x="20" y="42" width="16" height="1" fill="#6B7280" opacity="0.5"/>
</svg>
